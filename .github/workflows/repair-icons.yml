name: Repair MarmaladePlayer icon alpha assets
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_icon_assets.py'
      - '.github/workflows/repair-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Generate verified transparent and purple-backed icon variants
        run: python scripts/build_icon_assets.py
      - name: Commit regenerated icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/marmalade-icon.webp assets/marmalade-transparent.png assets/marmalade-maskable.png assets/apple-touch-icon.png
          if ! git diff --staged --quiet; then
            git commit -m "Fix black corners in shared launcher assets"
            git push origin HEAD:main
          fi
