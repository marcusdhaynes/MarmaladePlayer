name: Marmaladeum audit verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marmalade-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check rolling-buffer.js && node --check sw.js && node --check settings-layout.js
      - run: node --test tests/rolling-buffer.test.cjs tests/offline-shell.test.cjs tests/library-reconcile.test.mjs tests/game-randomization.test.mjs tests/web-release.test.mjs tests/update-identity.test.mjs
      - run: node scripts/install-mkv-decoder.mjs
      - run: node --test tests/mkv-compatibility.test.cjs tests/mkv-playback-pipeline.test.cjs
      - run: node scripts/validate-mkv-decoder-assets.mjs
      - run: node desktop/scripts/prepare-web.mjs && node mobile/scripts/prepare-web.mjs
      - run: node --test tests/native-package-assets.test.mjs
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - name: Install browser and signed Ubuntu dependencies
        run: |
          # Microsoft feed is unrelated to these Linux browser dependencies.
          # Hosted-runner feed outages must not prevent genuine WebKit tests.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
          for attempt in 1 2 3; do
            if npx playwright install --with-deps ${{ matrix.engine }}; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Verify embedded captions with independently muxed movies
        if: matrix.engine == 'chromium'
        run: |
          sudo apt-get install -y ffmpeg
          npm install --no-save --no-package-lock playwright@1.51.1 webm-muxer@5.1.4
          node tests/embedded-caption-playback.mjs
      - run: node scripts/install-mkv-decoder.mjs
      - run: |
          python3 -m http.server 8080 > /tmp/marmalade-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/index.html >/dev/null && break; sleep 1; done
          node tests/audit-browser-smoke.mjs ${{ matrix.engine }}
