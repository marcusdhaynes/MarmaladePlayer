name: Marmalade Settings Layout
on:
  push:
    paths:
      - index.html
      - settings-layout.js
      - settings-layout.css
      - tests/settings-layout.mjs
      - .github/workflows/settings-layout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --check settings-layout.js
      - run: node tests/settings-layout.mjs
      - name: Preserve settings screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-desktop-mobile
          path: test-artifacts/settings-layout
          if-no-files-found: ignore
