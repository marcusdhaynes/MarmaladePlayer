name: Marmalade Library Extensions
on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'scripts/build-media-extensions.mjs'
      - 'tests/extension-catalog.mjs'
      - 'tests/extension-bridge.mjs'
      - '.github/workflows/media-library-extensions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check extension code and manifests
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/library.js
          node --check extension/lib/store.mjs
          node --check extension/lib/catalog.mjs
          node tests/extension-catalog.mjs
          node tests/extension-bridge.mjs
      - name: Build seven minimal five-file browser extensions
        run: |
          node scripts/build-media-extensions.mjs
          mkdir -p dist/extension-packages
          for target in chrome edge brave opera vivaldi firefox safari; do
            cd "dist/media-extensions/$target"
            zip -q -r "../../extension-packages/marmalade-library-$target.zip" .
            cd ../../..
          done
          cp dist/extension-packages/marmalade-library-firefox.zip dist/extension-packages/marmalade-library-firefox-unsigned.xpi
          python3 -c "import glob,zipfile; files=glob.glob('dist/extension-packages/*.zip'); assert len(files)==7; assert all(len([n for n in zipfile.ZipFile(f).namelist() if not n.endswith('/')])==7 for f in files)"
      - uses: actions/upload-artifact@v4
        with:
          name: marmalade-library-extensions-v0.2.0
          path: dist/extension-packages/*
          retention-days: 90
      - name: Publish downloadable prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view marmalade-library-v0.2.0 || gh release create marmalade-library-v0.2.0 --prerelease --title 'Marmalade Library v0.2.0' --notes 'Independent seven-file browser extensions. Unsigned Firefox and Safari source need platform signing for permanent installation.'
          gh release upload marmalade-library-v0.2.0 dist/extension-packages/* --clobber
  safari-project:
    needs: package
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-media-extensions.mjs
      - name: Generate unsigned Safari macOS Xcode wrapper
        run: |
          mkdir -p dist/safari-xcode
          xcrun safari-web-extension-packager --copy-resources --no-open --no-prompt --swift --macos-only --app-name 'Marmalade Library' --bundle-identifier com.somniel.marmaladelibrary --project-location "$PWD/dist/safari-xcode" "$PWD/dist/media-extensions/safari"
      - uses: actions/upload-artifact@v4
        with:
          name: marmalade-library-safari-xcode-unsigned
          path: dist/safari-xcode
          retention-days: 90
