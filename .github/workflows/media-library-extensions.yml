name: Marmalade Library Extensions
on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'scripts/build-media-extensions.mjs'
      - 'tests/extension-catalog.mjs'
      - 'tests/extension-bridge.mjs'
      - '.github/workflows/media-library-extensions.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check extension code and manifests
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/library.js
          node --check extension/lib/store.mjs
          node --check extension/lib/catalog.mjs
          node tests/extension-catalog.mjs
          node tests/extension-bridge.mjs
      - name: Build seven browser targets with five files each
        run: |
          node scripts/build-media-extensions.mjs
          mkdir -p dist/extension-packages
          for target in chrome edge brave opera vivaldi minternet firefox safari; do
            cd "dist/media-extensions/$target"
            zip -q -r "../../extension-packages/marmalade-library-$target.zip" .
            cd ../../..
          done
          cp dist/extension-packages/marmalade-library-firefox.zip dist/extension-packages/marmalade-library-firefox-unsigned.xpi
          python3 -c "import glob,zipfile; files=glob.glob('dist/extension-packages/*.zip'); assert len(files)==8; assert all(len([n for n in zipfile.ZipFile(f).namelist() if not n.endswith('/')])==5 for f in files)"
          node --input-type=module --check < dist/media-extensions/chrome/library.js
          node --input-type=module --check < dist/media-extensions/firefox/library.js
      - name: Build outer ZIP that also imports in older Minternet builds
        run: |
          set -euo pipefail
          mkdir -p dist/universal-direct-import/browser-packages
          for file in manifest.json background.js content.js library.html library.js; do
            cp "dist/media-extensions/minternet/$file" "dist/universal-direct-import/$file"
          done
          cp dist/extension-packages/*.zip dist/universal-direct-import/browser-packages/
          printf '%s\n' 'Minternet: select THIS OUTER ZIP from Extensions > Minternet > Import. Its manifest.json and runtime files are at the ZIP root for compatibility with older importers. The browser-specific ZIPs remain inside browser-packages/. File permissions still follow browser/OS rules.' > dist/universal-direct-import/DIRECT-IMPORT.txt
          (cd dist/universal-direct-import && zip -q -r ../extension-packages/marmalade-library-universal-direct-import.zip manifest.json background.js content.js library.html library.js DIRECT-IMPORT.txt browser-packages)
          python3 -c "import zipfile,json; p='dist/extension-packages/marmalade-library-universal-direct-import.zip'; z=zipfile.ZipFile(p); assert z.testzip() is None; assert json.loads(z.read('manifest.json'))['manifest_version']==3; assert len([x for x in z.namelist() if x.endswith('.zip')])==8; print('PASS: outer ZIP imports directly and includes eight nested browser packages')"
      - uses: actions/upload-artifact@v4
        with:
          name: marmalade-library-extensions-v0.2.0
          path: dist/extension-packages/*
          retention-days: 90
      - name: Publish downloadable prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view marmalade-library-v0.2.0 || gh release create marmalade-library-v0.2.0 --prerelease --title 'Marmalade Library v0.2.0' --notes 'Independent five-file browser extensions. Unsigned Firefox and Safari source need platform signing for permanent installation.'
          gh release upload marmalade-library-v0.2.0 dist/extension-packages/* --clobber
  safari-project:
    needs: package
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-media-extensions.mjs
      - name: Generate unsigned Safari macOS Xcode wrapper
        run: |
          mkdir -p dist/safari-xcode
          xcrun safari-web-extension-packager --copy-resources --no-open --no-prompt --swift --macos-only --app-name 'Marmalade Library' --bundle-identifier com.somniel.marmaladelibrary --project-location "$PWD/dist/safari-xcode" "$PWD/dist/media-extensions/safari"
      - uses: actions/upload-artifact@v4
        with:
          name: marmalade-library-safari-xcode-unsigned
          path: dist/safari-xcode
          retention-days: 90
