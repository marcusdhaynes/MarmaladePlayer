      - name: Publish durable pre-release artifacts
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=marmalade-library-v0.2.0
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "Marmalade Library v0.2.0 · Browser extensions" --notes "Independent 7-file media library extension packages for Chromium browsers, Firefox and Safari source. Firefox XPI is unsigned and requires signing for permanent installation; Safari source requires Apple packaging/signing. Catalog backup does not bypass browser file permissions."
          fi
          gh release upload "$tag" dist/extension-packages/* --clobber
  safari-project:
    needs: package
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-media-extensions.mjs
      - name: Package macOS Safari Xcode project (signing happens separately)
        run: |
          mkdir -p dist/safari-xcode
          xcrun safari-web-extension-packager --copy-resources --no-open --no-prompt --swift --macos-only --app-name 'Marmalade Library' --bundle-identifier com.somniel.marmaladelibrary --project-location "$PWD/dist/safari-xcode" "$PWD/dist/media-extensions/safari"
      - uses: actions/upload-artifact@v4
        with:
          name: marmalade-library-safari-xcode-unsigned
          path: dist/safari-xcode
          retention-days: 90
