name: Live Public Room Discovery
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/live-room-discovery.mjs'
      - '.github/workflows/live-room-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-signaling:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-room-discovery.mjs
