name: Verify approved full-bleed icon
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/approved-fullbleed-icon.webp'
      - 'scripts/build_icon_assets.py'
      - 'manifest.webmanifest'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/verify-fullbleed-icon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  icon-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Generate all icon variants and reject black corners
        run: python scripts/build_icon_assets.py
      - name: Verify browser and PWA icon links
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          html=Path('index.html').read_text()
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          for path in ('favicon.svg','favicon.ico','favicon-32.png',
                       'assets/marmalade-icon.webp','assets/marmalade-transparent.png',
                       'assets/marmalade-maskable.png','assets/apple-touch-icon.png'):
              assert Path(path).is_file(),path
              assert path in html or path in str(manifest['icons']) or path.startswith('assets/marmalade-')
              if path.endswith(('.png','.webp','.ico')):
                  with Image.open(path) as im:
                      im=im.convert('RGBA')
                      for point in ((0,0),(im.width-1,0),(0,im.height-1),(im.width-1,im.height-1)):
                          assert im.getpixel(point)[3]==255,(path,point)
          assert '20261104-fullbleed-v1' in html
          assert '20261104-fullbleed-v1' in str(manifest['icons'])
          print('Full-bleed PWA, favicon and header icons verified')
          PY
