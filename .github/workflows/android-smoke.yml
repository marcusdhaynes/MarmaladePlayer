name: MarmaladePlayer Android Emulator Smoke
on:
  workflow_run:
    workflows: ["MarmaladePlayer Android APK"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Download exact APK from passing build
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p candidate
          gh run download "$APK_RUN_ID" --repo "$GITHUB_REPOSITORY" --name MarmaladePlayer-Android-APK --dir candidate
          test -s candidate/app-debug.apk
      - name: Enable hardware acceleration for emulator
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Launch APK on Android 15 emulator and check for fatal crashes
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-boot-timeout: 600
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048 -cores 2
          script: bash scripts/android-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MarmaladePlayer-Android-Emulator-Screenshot
          path: |
            marmalade-screen.png
            marmalade-logcat.txt
            marmalade-runtime.txt
            marmalade-startup.png
            marmalade-launch.txt
            marmalade-activities.txt
          if-no-files-found: ignore
          retention-days: 14
