name: SubDL Download and Subtitle Playback
on:
  push:
    paths:
      - index.html
      - subtitle-codec.js
      - subtitle-archive.js
      - subtitle-search.js
      - watch-sync-subtitles.js
      - tests/subdl-download-browser.mjs
      - .github/workflows/subdl-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/subdl-download-browser.mjs
