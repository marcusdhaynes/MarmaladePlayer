name: MarmaladePlayer Android APK
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'movie-info.js'
      - 'movie-info.css'
      - 'public-movie-info.js'
      - 'watch-sync-subtitles.js'
      - 'settings-layout.js'
      - 'settings-layout.css'
      - 'rapid-controls.js'
      - 'rapid-controls.css'
      - 'subtitle-compact.js'
      - 'subtitle-codec.js'
      - 'subtitle-archive.js'
      - 'sw.js'
      - 'subtitle-match.js'
      - 'subtitle-search.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'scripts/build_icon_assets.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Normalize shared app icons before packaging
        run: |
          python -m pip install --quiet pillow
          python scripts/build_icon_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Prepare Shared Web App
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run verify
          npm run prepare:web
      - name: Generate Native Android Project
        working-directory: mobile
        run: |
          npx cap add android
          node scripts/patch-native.mjs
          npx cap sync android
      - name: Add MarmaladePlayer Launcher Icon
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python mobile/scripts/generate_icons.py
      - name: Build Installable Android APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Verify APK exists and is an Android package
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t mobile/android/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          unzip -Z1 mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/public/index.html'
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose mobile/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MarmaladePlayer-Android-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish Downloadable Preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-preview-${GITHUB_SHA:0:10}"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk MarmaladePlayer-Android.apk
          gh release create "$TAG" MarmaladePlayer-Android.apk --title "MarmaladePlayer Android Preview ${GITHUB_SHA:0:10}" --notes "Installable debug-signed Android preview. WebRTC hosting and local file playback require device testing. Android 8+; not a Play Store-signed release." --prerelease --target "$GITHUB_SHA"
