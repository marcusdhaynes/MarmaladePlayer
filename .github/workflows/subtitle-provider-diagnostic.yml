name: Subtitle Provider Diagnostic
on:
  push:
    paths:
      - tests/subtitle-provider-diagnostic.mjs
      - .github/workflows/subtitle-provider-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/subtitle-provider-diagnostic.mjs
