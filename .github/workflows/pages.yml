name: Publish Marmalade Player web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marmalade-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate approved full-bleed web icons
        run: |
          python -m pip install --quiet pillow
          python scripts/build_icon_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage on-demand MKV audio decoder
        run: node scripts/install-mkv-decoder.mjs
      - name: Validate static web app
        run: |
          test -s index.html
          test -s auto-mkv-audio.js
          test -s vendor/libav-wasm/index.js
          test -s vendor/libav-wasm/worker.js
          test -s vendor/libav-wasm/libav.wasm
          test -s vendor/libav-wasm/libav-jspi.wasm
          test -s manifest.webmanifest
          test -s sw.js
          test -s favicon.svg
          test -s favicon.ico
          test -s favicon-32.png
          test -s assets/approved-fullbleed-icon.webp
          test -s assets/marmalade-icon.webp
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
