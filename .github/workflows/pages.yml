name: Publish Marmalade Player web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marmalade-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified icon transparency
        run: |
          python -m pip install --quiet pillow
          python scripts/build_icon_assets.py
      - name: Validate static web app
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s sw.js
          test -s favicon.svg
          test -s assets/marmalade-icon.webp
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
