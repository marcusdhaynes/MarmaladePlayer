name: Publish Marmalade Player web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: marmalade-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate approved full-bleed web icons
        run: |
          python -m pip install --quiet pillow
          python scripts/build_icon_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage on-demand MKV audio decoder
        run: node scripts/install-mkv-decoder.mjs
      - name: Test native-stream MKV audio decoding contracts
        run: |
          node --test tests/mkv-compatibility.test.cjs tests/mkv-playback-pipeline.test.cjs
          node scripts/validate-mkv-decoder-assets.mjs
          node --check auto-mkv-audio.js
          node --check rolling-buffer.js
          node --test tests/rolling-buffer.test.cjs tests/offline-shell.test.cjs
          node --check sw.js
          node --check settings-layout.js
          node --check mkv-decoder-io.js
          node --check mkv-asyncify-worker.js
      - name: Validate static web app
        run: |
          test -s index.html
          test -s mkv-decoder-io.js
          test -s mkv-asyncify-worker.js
          test -s auto-mkv-audio.js
          test -s vendor/libav-wasm/index.js
          test -s vendor/libav-wasm/worker.js
          test -s vendor/libav-wasm/libav.wasm
          test -s vendor/libav-wasm/libav-jspi.wasm
          test -s manifest.webmanifest
          test -s sw.js
          test -s favicon.svg
          test -s favicon.ico
          test -s favicon-32.png
          test -s assets/approved-fullbleed-icon.webp
          test -s assets/marmalade-icon.webp
      - name: Stamp deployment identity and isolate the release cache
        run: |
          node -e 'const fs=require("node:fs");const sha=process.env.GITHUB_SHA;fs.writeFileSync("build-info.json",JSON.stringify({commit:sha,run:process.env.GITHUB_RUN_ID}));const sw=fs.readFileSync("sw.js","utf8");fs.writeFileSync("sw.js",sw.replace(/marmalade-shell-v75-audit/,"marmalade-shell-"+sha));'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for uploaded Pages artifact to become visible to REST API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo 'Pages artifact did not become visible' >&2
          exit 1
      - name: Allow Pages artifact service to converge
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final deployment attempt
        if: steps.retry1.outcome == 'failure'
        run: sleep 40
      - id: retry2
        if: steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Verify deployed release identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
        run: |
          node -e 'const u=new URL("build-info.json",process.env.PAGE_URL.endsWith("/")?process.env.PAGE_URL:process.env.PAGE_URL+"/");u.searchParams.set("verify",process.env.GITHUB_SHA);(async()=>{for(let i=0;i<8;i++){try{const r=await fetch(u,{cache:"no-store"});if(r.ok&&(await r.json()).commit===process.env.GITHUB_SHA)return;}catch{}await new Promise(r=>setTimeout(r,5000));}throw Error("Published commit could not be verified");})().catch(e=>{console.error(e);process.exitCode=1});'
