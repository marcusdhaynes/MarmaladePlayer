name: Marmalade Games and Scoreboard Layout
on:
  push:
    branches: [main]
    paths:
      - 'games.css'
      - 'games.js'
      - 'media-library.css'
      - 'index.html'
      - 'tests/games-ui.mjs'
      - 'tests/onlyframes-game-flow.mjs'
      - 'tests/game-no-autoplay.mjs'
      - 'tests/game-loading-gate.mjs'
      - 'tests/onlyframes-library-selector.mjs'
      - 'tests/browser-local-video-fallback.mjs'
      - 'media-library.js'
      - '.github/workflows/games-layout.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Games JavaScript syntax
        run: |
          node --check games.js
          node --check tests/games-ui.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check Games window height and scoreboard alignment
        run: node tests/games-ui.mjs
      - name: Verify OnlyFrames session, random videos, timestamp picker and End Game
        run: node tests/onlyframes-game-flow.mjs
      - name: Verify delayed metadata, frame decode, seeking and cancellation
        run: node tests/game-loading-gate.mjs
      - name: Verify game-only frame locking and native-player autoplay
        run: node tests/game-no-autoplay.mjs
      - name: Show every Media Library in the top-layer game selector
        run: node tests/onlyframes-library-selector.mjs
      - name: Verify browser-only video folder, files and ten repeated relinks
        run: node tests/browser-local-video-fallback.mjs
