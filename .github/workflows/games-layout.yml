name: Marmalade Games and Scoreboard Layout
on:
  push:
    branches: [main]
    paths:
      - 'games.css'
      - 'games.js'
      - 'media-library.css'
      - 'index.html'
      - 'tests/games-ui.mjs'
      - '.github/workflows/games-layout.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Games JavaScript syntax
        run: |
          node --check games.js
          node --check tests/games-ui.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check Games window height and scoreboard alignment
        run: node tests/games-ui.mjs
      - name: Verify OnlyFrames session, random videos, timestamp picker and End Game
        run: node tests/onlyframes-game-flow.mjs
