name: Deploy to marmaladeum.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent a superseded deploy from replacing a newer production release.
concurrency:
  group: marmaladeum-dreamhost-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # MarmaladePlayer is a static web app (no dist/ build like Somniel).
      # These are the same staging steps its GitHub Pages workflow uses,
      # so marmaladeum.com serves exactly what Pages serves.
      - name: Generate approved full-bleed web icons
        run: |
          python -m pip install --quiet pillow
          python scripts/build_icon_assets.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage on-demand MKV audio decoder
        run: node scripts/install-mkv-decoder.mjs

      - name: Validate static web app
        run: |
          test -s index.html
          test -s auto-mkv-audio.js
          test -s vendor/libav-wasm/index.js
          test -s vendor/libav-wasm/worker.js
          test -s vendor/libav-wasm/libav.wasm
          test -s vendor/libav-wasm/libav-jspi.wasm
          test -s manifest.webmanifest
          test -s sw.js
          test -s favicon.svg
          test -s favicon.ico
          test -s favicon-32.png
          test -s assets/approved-fullbleed-icon.webp
          test -s assets/marmalade-icon.webp

      # Same deploy mechanism as somniel.com (Oct 31, 2026): rsync over SSH
      # using a dedicated deploy key (DREAMHOST_SSH_KEY secret). Password-based
      # SSH hung on DreamHost's side, and FTP-Deploy-Action never supported SFTP.
      - name: Deploy to DreamHost over SSH (rsync + deploy key)
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete --exclude='.dh-diag' --exclude='.git/' \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ \
            "${{ secrets.DREAMHOST_SFTP_USER }}@${{ secrets.DREAMHOST_SFTP_HOST }}:/home/marcusdhaynes/marmaladeum.com/"
