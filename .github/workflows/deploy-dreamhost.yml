name: Deploy to marmaladeum.com

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_ref:
        description: 'Optional complete commit SHA or marmalade-backup-<12 hex chars> tag to redeploy'
        required: false
        type: string

# Prevent a superseded deploy from replacing a newer production release.
concurrency:
  group: marmaladeum-dreamhost-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested rollback version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_ref != '' }}
        shell: bash
        env:
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          if [[ ! "$ROLLBACK_REF" =~ ^([a-f0-9]{40}|marmalade-backup-[a-f0-9]{12})$ ]]; then
            echo "Use a full 40-character commit SHA or Marmaladeum backup tag."
            exit 1
          fi
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_ref || github.sha }}

      # MarmaladePlayer is a static web app (no dist/ build like Somniel).
      # These are the same staging steps its GitHub Pages workflow uses,
      # so marmaladeum.com serves exactly what Pages serves.
      - name: Generate approved full-bleed web icons
        run: |
          python -m pip install --quiet pillow
          python scripts/build_icon_assets.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage on-demand MKV audio decoder
        run: node scripts/install-mkv-decoder.mjs

      - name: Test decoder packaging and Minternet MKV audio compatibility
        run: |
          node scripts/validate-mkv-decoder-assets.mjs
          node --test tests/mkv-compatibility.test.cjs tests/mkv-playback-pipeline.test.cjs
          node --check auto-mkv-audio.js
          node --check mkv-decoder-io.js
          node --check mkv-asyncify-worker.js
      - name: Validate static web app
        run: |
          test -s index.html
          test -s mkv-decoder-io.js
          test -s mkv-asyncify-worker.js
          test -s auto-mkv-audio.js
          test -s vendor/libav-wasm/index.js
          test -s vendor/libav-wasm/worker.js
          test -s vendor/libav-wasm/libav.wasm
          test -s vendor/libav-wasm/libav-jspi.wasm
          test -s manifest.webmanifest
          test -s sw.js
          test -s favicon.svg
          test -s favicon.ico
          test -s favicon-32.png
          test -s assets/approved-fullbleed-icon.webp
          test -s assets/marmalade-icon.webp

      - name: Stamp selected commit and hash web assets
        shell: bash
        run: |
          set -euo pipefail
          # The selected rollback commit may predate the release utility.
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:scripts/stamp-web-release.mjs" > "$RUNNER_TEMP/stamp-web-release.mjs"
          node "$RUNNER_TEMP/stamp-web-release.mjs" stamp "$(git rev-parse HEAD)"

      # Same deploy mechanism as somniel.com (Oct 31, 2026): rsync over SSH
      # using a dedicated deploy key (DREAMHOST_SSH_KEY secret). Password-based
      # SSH hung on DreamHost's side, and FTP-Deploy-Action never supported SFTP.
      - name: Deploy to DreamHost over SSH (rsync + deploy key)
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete --exclude='.dh-diag' --exclude='.git/' \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ \
            "${{ secrets.DREAMHOST_SFTP_USER }}@${{ secrets.DREAMHOST_SFTP_HOST }}:/home/marcusdhaynes/marmaladeum.com/"

      - name: Verify live production identity and asset bytes
        run: node "$RUNNER_TEMP/stamp-web-release.mjs" verify https://marmaladeum.com/
