name: MarmaladePlayer Desktop Windows macOS Linux
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'standalone-pip.js'
      - 'adaptive-brightness.js'
      - 'tests/standalone-pip.test.mjs'
      - 'movie-info.js'
      - 'movie-info.css'
      - 'public-movie-info.js'
      - 'watch-sync-subtitles.js'
      - 'subtitle-match.js'
      - 'subtitle-search.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'scripts/build_icon_assets.py'
      - 'favicon.svg'
      - '.github/workflows/desktop-native.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            label: Windows
          - os: macos-latest
            bundle: dmg
            label: macOS
          - os: ubuntu-22.04
            bundle: appimage
            label: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize shared app icons before packaging
        run: |
          python -m pip install --quiet pillow
          python scripts/build_icon_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Install local Tauri CLI
        working-directory: desktop
        run: npm install --no-fund --no-audit
      - name: Prepare the same shared web player and native icons
        working-directory: desktop
        run: |
          npm run prepare
          python -m pip install --quiet pillow
          python scripts/export-icon.py
          npx tauri icon ../assets/marmalade-desktop-icon.png
      - name: Test standalone Picture-in-Picture regression cases
        run: node tests/standalone-pip.test.mjs
      - name: Package native app
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: MarmaladePlayer-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
      # Actions artifacts expire; the successful installer is also preserved
      # permanently on the commit-specific GitHub Release for true rollback.
      - name: Save native desktop installer to permanent GitHub version backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:12}"
          TAG="marmalade-backup-${SHORT}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Marmaladeum Version Backup ${SHORT}" \
              --notes "Commit-pinned version backup. Successful platform packages are attached separately." \
              --prerelease || gh release view "$TAG" >/dev/null
          fi
          case "${{ matrix.bundle }}" in
            nsis) FILES=(desktop/src-tauri/target/release/bundle/nsis/*.exe); EXT="exe";;
            dmg) FILES=(desktop/src-tauri/target/release/bundle/dmg/*.dmg); EXT="dmg";;
            appimage) FILES=(desktop/src-tauri/target/release/bundle/appimage/*.AppImage); EXT="AppImage";;
            *) exit 1;;
          esac
          test -s "${FILES[0]}"
          cp "${FILES[0]}" "Marmaladeum-${{ matrix.label }}-${SHORT}.${EXT}"
          gh release upload "$TAG" "Marmaladeum-${{ matrix.label }}-${SHORT}.${EXT}" --clobber
