name: MarmaladePlayer Desktop Windows macOS Linux
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'index.html'
      - 'movie-info.js'
      - 'movie-info.css'
      - 'public-movie-info.js'
      - 'watch-sync-subtitles.js'
      - 'subtitle-match.js'
      - 'subtitle-search.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - '.github/workflows/desktop-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            label: Windows
          - os: macos-latest
            bundle: dmg
            label: macOS
          - os: ubuntu-22.04
            bundle: appimage
            label: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Install local Tauri CLI
        working-directory: desktop
        run: npm install --no-fund --no-audit
      - name: Prepare the same shared web player and native icons
        working-directory: desktop
        run: |
          npm run prepare
          python -m pip install --quiet pillow
          python scripts/export-icon.py
          npx tauri icon ../assets/marmalade-desktop-icon.png
      - name: Package native app
        working-directory: desktop
        run: npx tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: MarmaladePlayer-${{ matrix.label }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
