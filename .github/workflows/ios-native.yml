name: MarmaladePlayer iOS Native Simulator
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      # Shared runtime changes must rebuild native packages, even when index.html is unchanged.
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - 'scripts/**'
      - 'standalone-pip.js'
      - 'adaptive-brightness.js'
      - 'tests/standalone-pip.test.mjs'
      - 'movie-info.js'
      - 'movie-info.css'
      - 'public-movie-info.js'
      - 'watch-sync-subtitles.js'
      - 'subtitle-match.js'
      - 'subtitle-search.js'
      - 'manifest.webmanifest'
      - 'assets/**'
      - 'scripts/build_icon_assets.py'
      - '.github/workflows/ios-native.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Normalize shared app icons before packaging
        run: |
          python -m pip install --quiet pillow
          python scripts/build_icon_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dependencies and Prepare Web App
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run verify
          npm run prepare:web
          npx cap add ios
          node scripts/patch-native.mjs
          npx cap sync ios
      - name: Generate iOS Launcher Icon
        run: |
          python -m pip install --quiet pillow
          python mobile/scripts/generate_icons.py
      - name: Compile Unsigned iOS Simulator App
        working-directory: mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - name: Verify iOS app exists
        working-directory: mobile
        run: |
          test -d ios-build/Build/Products/Debug-iphonesimulator/App.app
          ditto -c -k --sequesterRsrc --keepParent ios-build/Build/Products/Debug-iphonesimulator/App.app MarmaladePlayer-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MarmaladePlayer-iOS-Simulator
          path: mobile/MarmaladePlayer-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30
      - name: Save iOS simulator build to permanent GitHub version backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:12}"
          TAG="marmalade-backup-${SHORT}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "Marmaladeum Version Backup ${SHORT}" \
              --notes "Commit-pinned version backup. Successful platform packages are attached separately." \
              --prerelease || gh release view "$TAG" >/dev/null
          fi
          cp mobile/MarmaladePlayer-iOS-Simulator.zip "Marmaladeum-iOS-Simulator-${SHORT}.zip"
          gh release upload "$TAG" "Marmaladeum-iOS-Simulator-${SHORT}.zip" --clobber
