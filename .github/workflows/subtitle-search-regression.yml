name: Subtitle Search Regression
on:
  push:
    paths:
      - subtitle-match.js
      - subtitle-search.js
      - tests/subtitle-search-regression.cjs
      - .github/workflows/subtitle-search-regression.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check subtitle-match.js
      - run: node --check subtitle-search.js
      - run: node --test tests/subtitle-search-regression.cjs
