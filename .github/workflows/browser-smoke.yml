name: Marmalade Browser Smoke Checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium firefox
      - name: Prepare local-video verification fixture encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node tests/browser-smoke.mjs
      - run: node tests/webrtc-video.mjs
